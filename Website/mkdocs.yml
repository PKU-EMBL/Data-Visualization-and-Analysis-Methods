site_name: "Methodologies of Data Visualization and Analysis"
site_description: "Graduate course documentation for data visualization, analysis, and metagenomics"
repo_url: https://github.com/PKU-EMBL/Methodologies-of-Data-Visualization-and-Analysis
repo_name: PKU-EMBL/Methodologies-of-Data-Visualization-and-Analysis
site_author: "Zhaorui (Elijah) Jiang"
copyright: "Copyright &copy; PKU EMBL Lab 2026–2027"

nav:
  - Home: index.md
  - 中文: zh/index.md
  - Course Guide:
      - Environment Setup: Prerequisites_guild.md
  - Course Projects:
      - Final Project: final-project.md
  - Resources: api/index.md

plugins:
  - search:
      lang:
        - zh
        - en
  - mkdocs-jupyter
  - glightbox
  - mkdocstrings:
      enabled: !ENV [ENABLE_MKDOCSTRINGS, true]
      default_handler: python
      handlers:
        python:
          options:
            show_source: false

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: img/yu-lab-logo.png
  favicon: img/yu-lab-logo.png

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

  features:
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - toc.follow
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      linenums: true
      linenums_style: pymdownx-inline
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.snippets

extra_javascript:
  - javascripts/config.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - css/custom.css

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/PKU-EMBL/Methodologies-of-Data-Visualization-and-Analysis
      name: Methodologies of Data Visualization and Analysis on GitHub
